services:
  app:
    build: .   #builds image from dockerfile in current directory
    depends_on:   # docker compose starts redis before app
      - redis
    env_file:
      - .env
    deploy:
      replicas: 3
   
  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
  
  nginx:
    image: nginx:alpine
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  redis_data:
  