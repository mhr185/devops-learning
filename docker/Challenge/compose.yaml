services:
  app:
    build: .   #builds image from dockerfile in current directory
    depends_on:   # docker compose starts redis before app
      redis:
        condition: service_healthy
    #healthcheck:
     # test: ["executable", "arg"]
      #interval: 1m30s
      #timeout: 30s
      #retries: 5
      #start_period: 30s
    env_file:
      - .env
    deploy:
      replicas: 3
   
  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  nginx:
    image: nginx:alpine
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
        #condition: service_healthy

volumes:
  redis_data:
  